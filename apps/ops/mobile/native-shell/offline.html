    <title>BTX Ops Hub</title>
    <style>
      /* The offline page for the BTX Ops Hub iPhone app (Figma "Offline, phone", node 465:11727). It must render with no
         network, so the logo is inline and the font is the system's. */
      :root { --bg: #f4f5f2; --ink: #15171a; --muted: #545a60; --wash: #eceeea; --gold: #c99b31; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex; flex-direction: column; align-items: center;
        padding: max(64px, env(safe-area-inset-top)) 24px max(40px, env(safe-area-inset-bottom));
      }
      .logo { width: 59px; height: 26px; display: block; }
      .mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; width: 100%; }
      .mark { width: 64px; height: 64px; border-radius: 50%; background: var(--wash); display: grid; place-items: center; }
      h1 { margin: 0; font-size: 26px; font-weight: 500; letter-spacing: -0.01em; }
      p { margin: 8px 0 0; max-width: 300px; font-size: 16px; line-height: 1.5; color: var(--muted); }
      button {
        appearance: none; border: 0; border-radius: 0; width: 100%; height: 48px;
        background: var(--gold); color: var(--ink); font: inherit; font-size: 16px; font-weight: 600;
      }
      button:active { opacity: 0.85; }
      button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    </style>
